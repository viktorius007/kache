name: Publish fixture
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: kunobi-ninja/kache-action@1a33fb2ff51be23eb9e87abeae6edb65be78f71c
        with:
          save-cache: false
      - run: cargo build --release
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/fixture
